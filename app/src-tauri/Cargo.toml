[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
idl-rs-tauri = { path = "../../rust/tauri" }
tauri-plugin-dialog = "2.7.3"
# Registered so `idl-rs-tauri`'s `open_agent_terminal` can reach the plugin's
# Rust API (ruling R222 item 3). The webview is granted no shell permission
# in `capabilities/default.json`, so nothing in the frontend can spawn a
# process -- only that one command, with the program Settings names.
tauri-plugin-shell = "2.3.1"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
# `library.revealFolder` (ruling R244/R249): the frontend already depended on
# `@tauri-apps/plugin-opener` (`app/package.json`) but nothing registered its
# Rust half or granted it a capability, so `revealItemInDir` had no plugin to
# call through to. Registered here the same way as `tauri-plugin-shell` above.
tauri-plugin-opener = "2"

