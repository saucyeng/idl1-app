# Manual only: cargo-tarpaulin instruments every test binary and is much
# slower than a plain `cargo test` run. Kept off the push trigger to protect
# the repo's 2000 min/month Actions budget (see docs/CI.md).

name: Coverage

on:
  workflow_dispatch: {}

jobs:
  rust-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # See ci.yml: rust/.cargo/config.toml pins target-dir to a Windows path
      # shared across the dev machine's worktrees; on Linux that path cannot
      # be joined into LD_LIBRARY_PATH. The env var overrides it.
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Tauri v2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: cargo tarpaulin
        working-directory: rust
        run: |
          cargo tarpaulin \
            -p idl-rs -p idl-rs-cli -p idl-transport -p idl-rs-tauri \
            --out Xml --out Html --output-dir target/coverage \
            --timeout 600 \
            -- --test-threads=4

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: rust/target/coverage
          if-no-files-found: error

      - name: Summarize line coverage
        working-directory: rust
        run: |
          rate=$(grep -m1 -oP 'line-rate="\K[0-9.]+' target/coverage/cobertura.xml)
          pct=$(awk -v r="$rate" 'BEGIN { printf "%.1f", r * 100 }')
          echo "Rust line coverage: ${pct} %" >> "$GITHUB_STEP_SUMMARY"

  app-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: Unit tests with coverage
        working-directory: app
        run: npx vitest run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: app-coverage
          path: app/coverage
          if-no-files-found: error
