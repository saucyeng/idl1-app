# Builds and drafts a GitHub Release for idl1, publishing to the public
# saucyeng/idl1-releases repo so the in-app updater (ruling R231) has a
# `latest.json` it can fetch without auth. Bundles are updater-signed with
# `TAURI_SIGNING_PRIVATE_KEY`/`_PASSWORD` once Isaac has generated and
# stored that keypair (docs/RELEASING.md); absent, the build is unsigned —
# Windows installers show a SmartScreen warning, and the app's own
# placeholder-pubkey guard keeps update checks off rather than trusting an
# unsigned `latest.json`. Windows code-signing and an Android keystore
# remain a separate follow-up.
#
# Trigger: push a tag matching v* (e.g. `git tag v0.1.0-alpha.1 && git push
# --tags`), or run manually via workflow_dispatch. Draft release only —
# publish it by hand once the artifacts look right.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      # rust/.cargo/config.toml pins target-dir to a Windows path shared
      # across the dev machine's worktrees; that path isn't valid on a
      # runner. Override with a workspace-relative path, same as ci.yml.
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Tauri v2 Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            app/src-tauri

      - name: Install NASM (Windows, needed by rustls' aws-lc-rs)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Ensure cmake is present (needed by rustls' aws-lc-rs)
        if: matrix.platform == 'windows-latest'
        run: cmake --version

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          body="$(.github/scripts/extract-changelog.sh "$version" CHANGELOG.md)"
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$body"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          # Publishes to the public `saucyeng/idl1-releases` repo (ruling
          # R231: the app repo is private, and the updater's `latest.json`
          # endpoint must be fetchable without auth) via a fine-grained
          # `RELEASES_TOKEN` secret Isaac creates on that repo. Falls back
          # to the app repo's own `GITHUB_TOKEN` when the secret is absent,
          # so the workflow keeps working before that secret exists —
          # `owner`/`repo` below fall back the same way.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          # The updater's signing keypair (docs/RELEASING.md: `npm run
          # tauri signer generate`). Isaac stores these as repo secrets;
          # absent, `tauri-action` builds unsigned updater artifacts and
          # the app's own placeholder-pubkey guard keeps checking off.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "idl1 ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          owner: ${{ secrets.RELEASES_TOKEN && 'saucyeng' || '' }}
          repo: ${{ secrets.RELEASES_TOKEN && 'idl1-releases' || '' }}
          args: ${{ matrix.platform == 'ubuntu-22.04' && '--bundles appimage,deb' || '--bundles msi,nsis' }}
