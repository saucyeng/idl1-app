# App release pipeline (docs/RELEASING.md), modelled on idl0-app's.
#
# On a `v*` tag, three platform jobs build in parallel and each uploads its
# files as a workflow artifact; a final `release` job collects them all and
# publishes ONE GitHub Release on this repo. Splitting build from publish
# avoids the concurrent-upload race idl0 hit when parallel jobs wrote to the
# same release. A tag containing `-` (e.g. `v0.1.0-alpha.2`) publishes as a
# prerelease.
#
# Version: `app/src-tauri/tauri.conf.json` is the source of truth; the
# `version` job fails the run if the tag disagrees with it.
#
# Windows ships the NSIS setup .exe only (no MSI: see the matrix).
#
# Signing: Android only, from four repo secrets (docs/RELEASING.md). The
# in-app updater (ruling R231) is not wired up yet, so desktop bundles are
# not updater-signed and no `latest.json` is written.
#
# workflow_dispatch builds every platform without publishing -- a dry run
# whose files are left on the run as artifacts.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # the release job creates the GitHub Release

env:
  # rust/.cargo/config.toml pins target-dir to a Windows path shared across
  # the dev machine's worktrees; that path isn't valid on a runner.
  CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version and check it against the tag
        id: v
        run: |
          set -euo pipefail
          version="$(jq -r .version app/src-tauri/tauri.conf.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $version -- bump the version first (docs/RELEASING.md)"
            exit 1
          fi

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            # NSIS only: WiX/MSI rejects a non-numeric prerelease version
            # (`0.1.0-alpha.2`), and the setup .exe is what users run.
            bundles: nsis
          - platform: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Tauri v2 Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install NASM (Windows, needed by rustls' aws-lc-rs)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: tauri build
        working-directory: app
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Stage assets
        run: |
          set -euo pipefail
          bundle="$CARGO_TARGET_DIR/release/bundle"
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$bundle"/nsis/*.exe "dist/idl1-app-v${VERSION}-windows-x64-setup.exe"
          else
            cp "$bundle"/appimage/*.AppImage "dist/idl1-app-v${VERSION}-x86_64.AppImage"
            cp "$bundle"/deb/*.deb "dist/idl1-app-v${VERSION}-amd64.deb"
          fi
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The default adds the long-gone `tools` package, which current
          # sdkmanager rejects ("Failed to find package 'tools'").
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            app/src-tauri
          key: android

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is not set -- an unsigned APK cannot be installed (docs/RELEASING.md)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/idl1-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/idl1-release.jks" >> "$GITHUB_ENV"

      - name: tauri android build (arm64)
        working-directory: app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # versionCode must increase every release so a new APK installs as an
        # in-place update; github.run_number is monotonic per workflow (the
        # same trick idl0 uses). Renaming this workflow file resets it. Passed
        # as a file, not inline JSON: scripts/tauri.mjs runs the CLI through
        # a shell, which would strip the JSON's quotes.
        run: |
          echo '{"bundle":{"android":{"versionCode":${{ github.run_number }}}}}' > "$RUNNER_TEMP/android-version.json"
          npm run tauri -- android build --apk --target aarch64 --config "$RUNNER_TEMP/android-version.json"

      - name: Stage assets
        run: |
          set -euo pipefail
          apk="$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -1)"
          [ -n "$apk" ] || { echo "::error::no release APK produced"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/idl1-app-v${VERSION}-arm64.apk"
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: Android
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, desktop, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compose release notes
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          link() { echo "[$1](${base}/$1)"; }
          {
            echo "## Downloads"
            echo ""
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| 📱 Android (arm64) | $(link "idl1-app-v${VERSION}-arm64.apk") |"
            echo "| 🪟 Windows | $(link "idl1-app-v${VERSION}-windows-x64-setup.exe") |"
            echo "| 🐧 Linux | $(link "idl1-app-v${VERSION}-x86_64.AppImage") · $(link "idl1-app-v${VERSION}-amd64.deb") |"
            echo ""
            echo "**Android** — tap the APK to install (updates over any prior build)."
            echo "**Windows** — run the setup .exe. It is not code-signed yet: on the SmartScreen prompt choose More info → Run anyway."
            echo "**Linux** — make the AppImage executable (chmod +x) and run it, or \`sudo apt install ./idl1-app-*.deb\`."
            echo ""
            echo "SHA-256 checksums are attached below."
            echo ""
            echo "## Changes"
            echo ""
            # GitHub rejects a release body over 125,000 characters, and the
            # Unreleased section can be far longer than that; past a sane
            # size, link to the changelog at this tag instead.
            changes="$(bash .github/scripts/extract-changelog.sh "$VERSION" CHANGELOG.md)"
            if [ "${#changes}" -le 60000 ]; then
              echo "$changes"
            else
              echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)."
            fi
          } > NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: idl1 ${{ github.ref_name }}
          files: dist/*
          body_path: NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
