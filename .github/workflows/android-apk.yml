# Manual debug APK (arm64), for trying an Android change without cutting a
# release or needing the signing secrets: Actions -> "Android APK (debug)" ->
# Run workflow, on any branch. The debug APK is signed with the runner's
# throwaway debug key, so it will not install over a release build (uninstall
# first). Releases are built by release.yml.

name: Android APK (debug)

on:
  workflow_dispatch: {}

env:
  # rust/.cargo/config.toml pins target-dir to a Windows path.
  CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The default adds the long-gone `tools` package, which current
          # sdkmanager rejects ("Failed to find package 'tools'").
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            app/src-tauri
          key: android

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: tauri android build --debug (arm64)
        working-directory: app
        run: npm run tauri -- android build --debug --apk --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: idl1-android-debug
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
