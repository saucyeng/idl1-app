name: CI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # rust/.cargo/config.toml pins target-dir to a Windows path shared across
      # the dev machine's worktrees; on Linux that path cannot be joined into
      # LD_LIBRARY_PATH. The env var overrides it.
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Tauri v2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo test -p idl-rs -p idl-rs-cli
        working-directory: rust
        run: cargo test -p idl-rs -p idl-rs-cli -- --test-threads=4

      - name: cargo test -p idl-rs-tauri
        working-directory: rust
        run: cargo test -p idl-rs-tauri -- --test-threads=4

      - name: cargo test -p idl-transport
        working-directory: rust
        run: cargo test -p idl-transport -- --test-threads=4

      - name: Workbook reference is up to date
        # The reference is generated from the engine's own catalogs (ruling
        # R222 item 1), so a builtin added or renamed without regenerating it
        # would ship a reference that lies. Regenerate and fail on any diff.
        run: |
          cargo run --manifest-path rust/Cargo.toml -p idl-rs-cli --             docs workbook --out docs/WORKBOOK-REFERENCE.md --src docs/reference-src
          git diff --exit-code -- docs/WORKBOOK-REFERENCE.md

      - name: CLI reference and the app's command-table copy are up to date
        # C6 (R230): the CLI's command table is the source of truth for the
        # CLI reference and for app/src/shell/cliTable.json; a row added
        # without regenerating both would let the UI and CLI disagree.
        run: |
          cargo run --manifest-path rust/Cargo.toml -p idl-rs-cli -- docs cli --out docs/CLI-REFERENCE.md
          cargo run --manifest-path rust/Cargo.toml -p idl-rs-cli -- docs cli --json --out app/src/shell/cliTable.json > /dev/null
          git diff --exit-code -- docs/CLI-REFERENCE.md app/src/shell/cliTable.json

      - name: Wire golden fixtures are up to date
        # The goldens are generated from the engine's own encoders (ruling
        # R236), so an encoder changed without regenerating them would let
        # the committed bytes and the TS decoders' expectations silently
        # drift out of sync with the engine that produced them.
        run: |
          cargo run --manifest-path rust/Cargo.toml -p idl-rs-cli -- docs wire --out app/src/ipc/golden
          git diff --exit-code -- app/src/ipc/golden

      - name: cargo check app crate (app/src-tauri)
        # The Tauri app crate is compiled by nobody but `tauri dev/build`, so a
        # lane can land a type error here that every crate gate misses (R199).
        working-directory: app/src-tauri
        run: cargo check -p app

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npx tsc --noEmit

      - name: Import cycles (runtime imports only; .madgerc skips type imports)
        working-directory: app
        run: npx --yes madge@8 --no-spinner --circular --extensions ts,tsx --ts-config tsconfig.json src

      - name: Unit tests
        working-directory: app
        run: npx vitest run
