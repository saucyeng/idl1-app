name: CI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three Rust jobs run in parallel (2026-11-13): most of the time is compiling,
# and one job ran the engine, bridge and transport builds back to back. CI now
# finishes before Release's builds do, so Release waits for it before
# publishing (release.yml `ci`) at no cost in time. The app crate itself is
# compiled by Release's desktop and Android builds, so CI does not check it.
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: cargo test -p idl-rs -p idl-library -p idl-rs-cli
        working-directory: rust
        run: cargo test -p idl-rs -p idl-library -p idl-rs-cli -- --test-threads=4

      - name: Workbook reference is up to date
        # The reference is generated from the engine's own catalogs (ruling
        # R222 item 1), so a builtin added or renamed without regenerating it
        # would ship a reference that lies. Regenerate and fail on any diff.
        run: |
          cargo run --manifest-path rust/Cargo.toml -p idl-rs-cli -- docs workbook --out rust/docs/WORKBOOK-REFERENCE.md --src rust/docs/reference-src
          git -C rust diff --exit-code -- docs/WORKBOOK-REFERENCE.md

      - name: Function catalog is up to date
        # `functionCatalog.json` is generated the same way `cliTable.json` is
        # (ruling R249): a builtin added, renamed or re-documented without
        # regenerating it would leave the editor's completion disagreeing
        # with the engine, the drift this ruling exists to make impossible.
        run: |
          cargo run --manifest-path rust/Cargo.toml -p idl-rs-cli -- docs workbook --json --out app/src/routes/pages/Notebook/model/functionCatalog.json
          git diff --exit-code -- app/src/routes/pages/Notebook/model/functionCatalog.json

      - name: CLI reference and the app's command-table copy are up to date
        # C6 (R230): the CLI's command table is the source of truth for the
        # CLI reference and for app/src/shell/cliTable.json; a row added
        # without regenerating both would let the UI and CLI disagree.
        run: |
          cargo run --manifest-path rust/Cargo.toml -p idl-rs-cli -- docs cli --out rust/docs/CLI-REFERENCE.md
          cargo run --manifest-path rust/Cargo.toml -p idl-rs-cli -- docs cli --json --out app/src/shell/cliTable.json > /dev/null
          git -C rust diff --exit-code -- docs/CLI-REFERENCE.md
          git diff --exit-code -- app/src/shell/cliTable.json

  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Tauri v2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: cargo test -p idl1-bridge
        run: cargo test -p idl1-bridge -- --test-threads=4

      - name: Wire golden fixtures are up to date
        # The goldens are generated from the bridge's encoders (ruling R236),
        # so an encoder changed without regenerating them would let the
        # committed bytes and the TS decoders' expectations silently drift.
        run: |
          cargo run -p idl1-bridge --bin wire-golden -- --out app/src/ipc/golden
          git diff --exit-code -- app/src/ipc/golden

  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the BLE stack's build prerequisites (btleplug needs D-Bus)
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: cargo test -p idl1-transport
        run: cargo test -p idl1-transport -- --test-threads=4

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npx tsc --noEmit

      - name: Import cycles (runtime imports only; .madgerc skips type imports)
        working-directory: app
        run: npx --yes madge@8 --no-spinner --circular --extensions ts,tsx --ts-config tsconfig.json src

      - name: Unit tests
        working-directory: app
        run: npx vitest run

      - name: Production build; Notebook sandbox is self-contained (R69 opaque origin)
        working-directory: app
        run: npm run build
