name: CI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # rust/.cargo/config.toml pins target-dir to a Windows path shared across
      # the dev machine's worktrees; on Linux that path cannot be joined into
      # LD_LIBRARY_PATH. The env var overrides it.
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Tauri v2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo test -p idl-rs -p idl-rs-cli
        working-directory: rust
        run: cargo test -p idl-rs -p idl-rs-cli -- --test-threads=4

      - name: cargo test -p idl-rs-tauri
        working-directory: rust
        run: cargo test -p idl-rs-tauri -- --test-threads=4

      - name: cargo test -p idl-transport
        working-directory: rust
        run: cargo test -p idl-transport -- --test-threads=4

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: app
        run: npx vitest run
